name: Personal Windows build
on:
  workflow_dispatch:
  push:
    branches:
      - personal-build

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node Config
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: Install Dependencies
        run: yarn install --non-interactive --frozen-lockfile
      - name: Package App
        run: yarn run package
      - name: Check the app's code is there
        shell: bash
        run: ls "out/Kenku FM-win32-x64/resources/app/.webpack/main"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kenku-FM-win32-x64
          path: out/Kenku FM-win32-x64
          retention-days: 30
          include-hidden-files: true
